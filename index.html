<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khanta Reminder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<header>
    <h1>Khanta Reminder</h1>
</header>

<!-- TOP NAVBAR -->
<nav class="top-nav">
    <button onclick="showPage('home')">Home</button>
    <button onclick="showPage('add')">Add</button>
    <button onclick="showPage('list')">List</button>
</nav>

<!-- HOME PAGE -->
<section id="home" class="page active">

<div class="stats-grid">

    <div class="box">
        <h2 id="totalCustomers">0</h2>
        <p>Customers</p>
    </div>

    <div class="box">
        <h2 id="pendingAmount">₹0</h2>
        <p>Pending</p>
    </div>

    <div class="box">
        <h2 id="dueToday">0</h2>
        <p>Due Today</p>
    </div>

    <div class="box">
        <h2 id="paidCount">0</h2>
        <p>Paid</p>
    </div>

</div>

</section>

<!-- ADD PAGE -->
<section id="add" class="page">

<div class="card">

<input type="text" id="name" placeholder="Customer Name">

<input type="text" id="mobile" placeholder="Mobile Number">

<input type="number" id="amount" placeholder="Amount">

<input type="date" id="date">

<input type="text" id="note" placeholder="Note">

<button onclick="addRecord()">Save Reminder</button>

</div>

</section>

<!-- LIST PAGE -->
<section id="list" class="page">

<div class="card">
<input type="text" id="search" placeholder="Search Customer..." onkeyup="loadData()">
</div>

<div id="records"></div>

</section>

</div>

<script src="script.js"></script>

</body>
</html>
