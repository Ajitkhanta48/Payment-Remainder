<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Track customer payments and reminders in Khanta Reminder Pro.">
  <title>Khanta Reminder Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Khanta Reminder Pro</h1>

    <section class="stats" aria-label="Dashboard stats">
      <div class="box">
        <h2 id="totalCustomers">0</h2>
        <p>Customers</p>
      </div>
      <div class="box">
        <h2 id="pendingAmount">₹0</h2>
        <p>Pending</p>
      </div>
    </section>

    <section class="card" aria-label="Add due">
      <input type="text" id="name" placeholder="Customer Name" autocomplete="name">
      <input type="tel" id="mobile" placeholder="Mobile Number" inputmode="numeric" autocomplete="tel">
      <input type="number" id="amount" placeholder="Amount" min="1" step="1">
      <input type="date" id="date">
      <button type="button" onclick="addRecord()">Add Due</button>
    </section>

    <section class="card" aria-label="Search customer">
      <input type="search" id="search" placeholder="Search Customer..." onkeyup="loadData()">
    </section>

    <section id="records" aria-label="Records list"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
